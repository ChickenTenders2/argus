name: Argus Daily Scan

permissions:
  contents: write

on:
  schedule:
    - cron: '0 8 * * 1-5'  # 08:00 UTC = 09:00 BST, Monday–Friday
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  argus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Argus
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY:      ${{ secrets.FMP_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
        run: python argus.py

      - name: Commit updated data
        continue-on-error: true
        run: |
          git config user.name "Argus"
          git config user.email "argus@bot"
          git add argus_results.csv argus_results_history.csv argus_feature_history.csv argus_alerts_log.txt
          git diff --staged --quiet || git commit -m "Argus data update $(date +'%Y-%m-%d')"
          git push