name: Argus Daily Scan

on:
  schedule:
    - cron: '0 7 * * 1-5'  # 7am UTC weekdays
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  argus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Argus
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python argus.py

      - name: Commit memory update
        run: |
          git config user.name "Argus"
          git config user.email "argus@bot"
          git add argus_memory.csv
          git diff --staged --quiet || git commit -m "Argus memory update $(date +'%Y-%m-%d')"
          git push