name: Argus Daily Scan

permissions:
  contents: write

on:
  schedule:
    - cron: '0 11 * * 1-5'   # Pre-market: 06:00 ET Mon–Fri
    - cron: '0 14 * * 1-5'   # Open/Full: 09:00 ET Mon–Fri
    - cron: '30 21 * * 1-5'  # Post-close: 16:30 ET Mon–Fri
  workflow_dispatch:
    inputs:
      profile:
        description: 'Scan profile'
        required: false
        default: 'full'
        type: choice
        options: [premarket, full, postclose]

jobs:
  argus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Argus
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            CRON="${{ github.event.schedule }}"
            if [ "$CRON" = "0 11 * * 1-5" ]; then
              PROFILE="premarket"
            elif [ "$CRON" = "30 21 * * 1-5" ]; then
              PROFILE="postclose"
            else
              PROFILE="full"
            fi
          else
            PROFILE="${{ github.event.inputs.profile || 'full' }}"
          fi
          python argus.py --profile $PROFILE
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY:      ${{ secrets.FMP_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
          FINNHUB_API_KEY:  ${{ secrets.FINNHUB_API_KEY }}

      - name: Commit updated data
        continue-on-error: true
        run: |
          git config user.name "Argus"
          git config user.email "argus@bot"
          git add data/argus_results.csv data/argus_results_history.csv data/argus_feature_history.csv data/argus_memory.csv argus_alerts_log.txt
          git diff --staged --quiet || git commit -m "Argus data update $(date +'%Y-%m-%d')"
          git push