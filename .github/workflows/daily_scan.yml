name: Argus Daily Auto-Scan

on:
  schedule:
    # Runs at 21:00 UTC (roughly Market Close in US) Monday-Friday
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows you to manually click "Run workflow" in GitHub UI

jobs:
  run-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for auto-commit

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Headless Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_headless.py

      - name: Auto-commit updated Database and Log Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update: Scheduled Argus Scan Data & Logs"
          file_pattern: "argus.db argus_alerts_log.txt argus_*.csv"
