name: Argus 8-K Catalyst Poller

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'  # Every 30 min, 08:00–16:30 ET (13:00–21:30 UTC)
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker to rescore'
        required: false

jobs:
  catalyst-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 8-K catalyst check
        run: python argus.py --profile catalyst --ticker "${{ github.event.inputs.ticker || '' }}"
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY:      ${{ secrets.FMP_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
