name: Argus 8-K Catalyst Rescore

# Dispatch-only: a previous scheduled cron fired every 30 min with an empty
# ticker, which silently noop'd 32× per trading day. A real auto-poller that
# queries SEC EDGAR for recent 8-Ks and dispatches per filer is a follow-up.
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Ticker to rescore (required)'
        required: true

jobs:
  catalyst-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 8-K catalyst rescore
        run: python argus.py --profile catalyst --ticker "${{ github.event.inputs.ticker }}"
        env:
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FMP_API_KEY:      ${{ secrets.FMP_API_KEY }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
          FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
